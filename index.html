<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume AI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white">

<div class="flex h-screen">

  <!-- Sidebar -->
  <div class="w-64 bg-gray-900 p-4">
    <h1 class="text-xl font-bold mb-6">Hirevity</h1>
    <ul class="space-y-3">
      <li><button onclick="showPage('dashboard')" class="w-full text-left">Dashboard</button></li>
      <li><button onclick="showPage('analyzer')" class="w-full text-left">Resume Analyzer</button></li>
    </ul>
  </div>

  <!-- Content -->
  <div class="flex-1 p-6 overflow-auto">

    <!-- Dashboard -->
    <div id="dashboard">
      <h2 class="text-2xl font-bold">Welcome 🚀</h2>
      <p class="text-gray-400 mt-2">AI Resume Optimization Dashboard</p>
    </div>

    <!-- Analyzer -->
    <div id="analyzer" class="hidden">
      <h2 class="text-2xl font-bold mb-4">Resume Analyzer</h2>

      <textarea id="resume" placeholder="Paste Resume"
        class="w-full p-3 rounded bg-gray-800 mb-3"></textarea>

      <textarea id="job" placeholder="Paste Job Description"
        class="w-full p-3 rounded bg-gray-800 mb-3"></textarea>

      <button onclick="analyzeResume()"
        class="bg-purple-600 px-4 py-2 rounded">
        Analyze Resume
      </button>

      <div id="result" class="mt-6"></div>
    </div>

  </div>
</div>

<script>

// Navigation
function showPage(page) {
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("analyzer").classList.add("hidden");

  document.getElementById(page).classList.remove("hidden");
}

// MAIN FUNCTION
async function analyzeResume() {

  const resume = document.getElementById("resume").value;
  const jobDescription = document.getElementById("job").value;

  if (!resume || !jobDescription) {
    alert("Please fill both fields");
    return;
  }

  document.getElementById("result").innerHTML = "Analyzing...";

  try {
    const response = await fetch("PASTE_YOUR_MAKE_WEBHOOK_URL_HERE", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ resume, jobDescription }),
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
      <div class="bg-gray-900 p-6 rounded-xl">

        <h2 class="text-xl font-semibold mb-4">Result</h2>

        <p><b>Role:</b> ${data.role_detected}</p>
        <p><b>Industry:</b> ${data.industry}</p>

        <div class="mt-4">
          <p class="text-gray-400">ATS Score</p>
          <div class="w-full bg-gray-700 rounded-full h-3">
            <div class="bg-purple-500 h-3 rounded-full"
              style="width:${data.ats_score}%"></div>
          </div>
          <p>${data.ats_score}/100</p>
        </div>

        <div class="mt-4">
          <h3>Missing Keywords</h3>
          ${data.missing_keywords.map(k =>
            `<span class="bg-red-500/20 px-2 py-1 mr-2 rounded">${k}</span>`
          ).join("")}
        </div>

        <div class="mt-4">
          <h3>Suggestions</h3>
          <ul class="list-disc ml-5">
            ${data.suggestions.map(s => `<li>${s}</li>`).join("")}
          </ul>
        </div>

        <div class="mt-4">
          <h3>Job Links</h3>
          <ul>
            ${data.job_queries.map(q => `
              <li>
                <a href="https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(q)}"
                   target="_blank" class="text-blue-400 underline">
                   ${q}
                </a>
              </li>
            `).join("")}
          </ul>
        </div>

      </div>
    `;

  } catch (error) {
    console.error(error);
    document.getElementById("result").innerHTML = "Error occurred";
  }
}

</script>

</body>
</html>
